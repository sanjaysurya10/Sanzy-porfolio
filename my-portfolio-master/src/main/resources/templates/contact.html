<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
</head>
    <body>
            <!-- Page content-->
            <section class="py-5" th:fragment="contact">
                <div class="container px-5">
                    <!-- Contact form-->
                    <div class="glass-panel py-5 px-4 px-md-5">
                        <div class="text-center mb-5">
                            <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3"><i class="bi bi-envelope"></i></div>
                            <h1 class="fw-bolder">Get in touch</h1>
                            <p class="lead fw-normal text-muted mb-0">sanjaysurya386@gmail.com</p>
                        </div>
                        <div class="row gx-5 justify-content-center">
                            <div class="col-lg-8 col-xl-6">
                                <form id="contactForm" novalidate>
                                    <!-- Name input-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="name" type="text" placeholder="Enter your name..." required />
                                        <label for="name">Full name</label>
                                        <div class="invalid-feedback">A name is required.</div>
                                    </div>
                                    <!-- Email address input-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="email" type="email" placeholder="name@example.com" required />
                                        <label for="email">Email address</label>
                                        <div class="invalid-feedback">A valid email is required.</div>
                                    </div>
                                    <!-- Phone number input-->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="phone" type="tel" placeholder="(123) 456-7890" required />
                                        <label for="phone">Phone number</label>
                                        <div class="invalid-feedback">A phone number is required.</div>
                                    </div>
                                    <!-- Message input-->
                                    <div class="form-floating mb-3">
                                        <textarea class="form-control" id="message" placeholder="Enter your message here..." style="height: 10rem" required></textarea>
                                        <label for="message">Message</label>
                                        <div class="invalid-feedback">A message is required.</div>
                                    </div>
                                    <!-- Submit success message-->
                                    <div class="d-none" id="submitSuccessMessage">
                                        <div class="text-center mb-3" style="color:#64c8ff; font-weight:600;">
                                            Message sent! I'll get back to you soon.
                                        </div>
                                    </div>
                                    <!-- Submit error message-->
                                    <div class="d-none" id="submitErrorMessage">
                                        <div class="text-center mb-3" style="color:#ff9090;">Error sending message! Please email me directly at sanjaysurya386@gmail.com</div>
                                    </div>
                                    <!-- Submit Button-->
                                    <div class="d-grid"><button class="btn btn-primary btn-lg" id="submitButton" type="submit">Submit</button></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <script>
                (function() {
                    const form = document.getElementById('contactForm');
                    const submitBtn = document.getElementById('submitButton');
                    const successMsg = document.getElementById('submitSuccessMessage');
                    const errorMsg = document.getElementById('submitErrorMessage');

                    form.addEventListener('submit', async function(e) {
                        e.preventDefault();
                        e.stopPropagation();

                        // Clear previous messages
                        successMsg.classList.add('d-none');
                        errorMsg.classList.add('d-none');

                        // HTML5 validation
                        if (!form.checkValidity()) {
                            form.classList.add('was-validated');
                            return;
                        }

                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Sending...';

                        const params = new URLSearchParams({
                            name: document.getElementById('name').value.trim(),
                            email: document.getElementById('email').value.trim(),
                            phone: document.getElementById('phone').value.trim(),
                            message: document.getElementById('message').value.trim()
                        });

                        try {
                            const res = await fetch('/contact/submit', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body: params.toString()
                            });

                            if (res.ok) {
                                const data = await res.json();
                                if (data.status === 'success') {
                                    successMsg.classList.remove('d-none');
                                    form.reset();
                                    form.classList.remove('was-validated');
                                } else {
                                    errorMsg.classList.remove('d-none');
                                }
                            } else {
                                errorMsg.classList.remove('d-none');
                            }
                        } catch (err) {
                            errorMsg.classList.remove('d-none');
                        } finally {
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Submit';
                        }
                    });
                })();
                </script>
            </section>
    </body>
</html>
